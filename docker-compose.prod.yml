# 生产环境（单容器一体化）：docker compose -f docker-compose.prod.yml up -d
#
# 单个 visiondesk 容器内由 supervisord 拉起 nginx/app/worker/postgres/redis/minio，
# 服务间全部走容器内 127.0.0.1；对外仅 80/8443。
# 数据卷沿用旧多容器栈同名卷（pg/minio/SAM 权重数据无缝保留）。
# dev 环境仍用仓库根 docker-compose.yml，本文件与其互不影响。

name: visiondesk

services:
  visiondesk:
    build:
      context: .
      dockerfile: deploy/Dockerfile.allinone
    image: visiondesk:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://retouch:${POSTGRES_PASSWORD}@127.0.0.1:5432/retouch
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - minio_data:/data
      - selection_models:/root/.rembg/models
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl,urllib.request as u;c=ssl.create_default_context();c.check_hostname=False;c.verify_mode=ssl.CERT_NONE;u.urlopen('https://127.0.0.1:8443/api/health',context=c,timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s

  # 证书签发/续期（与主容器无关，按需运行）：
  # docker compose -f docker-compose.prod.yml --profile cert run --rm certbot <certbot 参数>
  certbot:
    image: certbot/dns-cloudflare
    profiles: ["cert"]
    volumes:
      - ./deploy/letsencrypt:/etc/letsencrypt
      - ./deploy/cloudflare.ini:/root/.secrets/cloudflare.ini:ro

volumes:
  pg_data:
  minio_data:
  selection_models:
