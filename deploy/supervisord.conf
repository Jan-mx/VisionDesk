; VisionDesk 单容器一体化进程管理：六进程按优先级拉起，日志直通 docker logs
; postgres(10) → redis(20) → minio(30) → app(40, 含数据库迁移) → worker(50) → nginx(60)

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/data
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
command=/usr/local/bin/minio server /data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
environment=MINIO_ROOT_USER="%(ENV_S3_ACCESS_KEY)s",MINIO_ROOT_PASSWORD="%(ENV_S3_SECRET_KEY)s"
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; app 是数据库迁移的唯一归属者：等 5432 就绪 → alembic（失败重试）→ uvicorn
[program:app]
command=/bin/sh -c "until python -c \"import socket;socket.create_connection(('127.0.0.1',5432),2)\" 2>/dev/null; do sleep 1; done; until alembic upgrade head; do echo '[app] alembic 失败，3s 后重试'; sleep 3; done; exec python -m uvicorn app.main:app --host 127.0.0.1 --port 7302"
directory=/app/backend
priority=40
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=/bin/sh -c "until python -c \"import socket;socket.create_connection(('127.0.0.1',5432),2)\" 2>/dev/null; do sleep 1; done; exec python -m arq app.worker.WorkerSettings"
directory=/app/backend
priority=50
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/bin/sh -c "until python -c \"import socket;socket.create_connection(('127.0.0.1',7302),2)\" 2>/dev/null; do sleep 1; done; exec nginx -g 'daemon off;'"
priority=60
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
